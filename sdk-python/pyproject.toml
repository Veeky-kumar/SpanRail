[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tracewell-py"
version = "0.1.0"
description = "Python SDK for Tracewell, a self-hosted LLM observability platform."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["llm", "observability", "tracing", "tracewell"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Veeky-kumar/tracewell"
Issues = "https://github.com/Veeky-kumar/tracewell/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tracewell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
