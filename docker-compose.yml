services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracewell
      POSTGRES_PASSWORD: tracewell
      POSTGRES_DB: tracewell
    ports:
      - "5455:5432"
    volumes:
      - tracewell_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracewell"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional LLM gateway (see gateway/README.md). Not started by default:
  #   docker compose --profile gateway up -d --build gateway
  # Outside of the production overlay it assumes Tracewell is running on the host
  # (npm run dev), hence host.docker.internal.
  gateway:
    profiles: ["gateway"]
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      UPSTREAM_URL: ${GATEWAY_UPSTREAM_URL:-https://api.openai.com}
      TRACEWELL_BASE_URL: ${GATEWAY_TRACEWELL_URL:-http://host.docker.internal:3000}
      TRACEWELL_PUBLIC_KEY: ${TRACEWELL_PUBLIC_KEY:-}
      TRACEWELL_SECRET_KEY: ${TRACEWELL_SECRET_KEY:-}
      # Keep serving (with /readyz = 503) briefly after SIGTERM so balancers notice.
      DRAIN_DELAY: 3s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback only: the gateway has no caller authentication and speaks plain HTTP, and clients
    # send their provider API keys through it. Put a TLS terminator / auth in front before
    # exposing it beyond this machine (or mount a cert and set TLS_CERT_FILE / TLS_KEY_FILE).
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Must exceed DRAIN_DELAY + SHUTDOWN_TIMEOUT (+ the final flush), or Docker kills it mid-flush.
    stop_grace_period: 40s

volumes:
  tracewell_postgres_data:
