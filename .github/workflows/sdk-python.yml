name: sdk-python

on:
  push:
    branches: [main]
    paths: ["sdk-python/**", ".github/workflows/sdk-python.yml"]
  pull_request:
    paths: ["sdk-python/**", ".github/workflows/sdk-python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest -e .
      - run: python -m pytest -q
