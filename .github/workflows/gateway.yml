name: gateway

# Only runs when the Go gateway (or this workflow) changes, so it never slows or breaks the
# existing Node app's workflow. There was no CI in the repository before this file.
on:
  push:
    branches: [main]
    paths: ["gateway/**", ".github/workflows/gateway.yml"]
  pull_request:
    paths: ["gateway/**", ".github/workflows/gateway.yml"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test (race detector)
        run: go test -race -count=1 ./...

      - name: build
        run: go build ./...

      # Fails on known vulnerabilities that the code actually reaches (stdlib included, so it
      # also catches an outdated Go toolchain). Version pinned for reproducibility.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t tracewell-gateway:ci gateway
