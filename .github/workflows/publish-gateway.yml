name: publish-gateway

# Publishes the gateway image to GitHub Container Registry. It runs only when a tag named
# gateway-vX.Y.Z is pushed, or when started by hand, so ordinary commits never publish anything.
on:
  push:
    tags: ["gateway-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/veeky-kumar/spanrail-gateway

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=gateway-v(.*),group=1
            type=match,pattern=gateway-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gateway-v') }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
